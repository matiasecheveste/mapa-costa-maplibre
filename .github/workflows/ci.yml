# Mapa de la costa de Rocha — Matías Nicolás Echeveste Cardozo
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: El worker de MapLibre se publica junto al sitio
        run: ls dist/assets/maplibre-gl-worker-*.mjs
